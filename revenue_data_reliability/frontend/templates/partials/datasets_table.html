<div id="datasets-table" hx-get="/api/datasets" hx-trigger="every 5s" hx-target="this" hx-swap="outerHTML">
  <table class="table">
    <thead>
      <tr><th>Dataset Name</th><th>Created At</th><th>Status</th><th>Rows</th><th>Months</th><th>Size (MB)</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for s in datasets %}
      <tr>
        <td>{{ s.name | scenario_label }}</td>
        <td>{{ s.created_at }}</td>
        <td>{{ s.status | capitalize }}</td>
        <td>{{ s.rows or "—" }}</td>
        <td>{{ s.months or "—" }}</td>
        <td>{{ s.size or "—" }}</td>
        <td>
          <form style="display:inline;" hx-post="/runs" hx-target="#runs-tbody" hx-swap="afterbegin">
            <input type="hidden" name="dataset" value="{{ s.name }}">
            <button type="submit" class="btn-primary"
                    {% if s.completed_run_id %}disabled title="Already validated"{% endif %}>Validate</button>
          </form>
          <button class="btn-danger"
                  hx-delete="/api/datasets/{{ s.name }}"
                  hx-target="closest tr"
                  hx-swap="outerHTML"
                  hx-confirm="Delete dataset {{ s.name | scenario_label }}?">
            Delete
          </button>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="7" class="empty">No datasets yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
