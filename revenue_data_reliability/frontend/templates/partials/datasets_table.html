<div id="datasets-table" hx-get="/api/datasets" hx-trigger="every 5s" hx-target="this" hx-swap="outerHTML">
  <table class="table">
    <thead>
      <tr><th>Dataset Name</th><th>Created At</th><th>Status</th><th>Rows</th><th>Months</th><th>Size (MB)</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for s in scenarios %}
      <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.created_at }}</td>
        <td>{{ s.status }}</td>
        <td>{{ s.rows or "—" }}</td>
        <td>{{ s.months or "—" }}</td>
        <td>{{ s.size or "—" }}</td>
        <td>
          <form style="display:inline;" hx-post="/runs" hx-target="#run-result" hx-swap="innerHTML">
            <input type="hidden" name="scenario" value="{{ s.name }}">
            <button type="submit" class="btn-primary">Validate</button>
          </form>
          <button class="btn-danger"
                  hx-delete="/api/scenarios/{{ s.name }}"
                  hx-target="closest tr"
                  hx-swap="outerHTML"
                  hx-confirm="Delete dataset {{ s.name }}?">
            Delete
          </button>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="7" class="empty">No datasets yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
