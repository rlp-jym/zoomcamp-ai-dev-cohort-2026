<div id="dataset-selector"
     hx-get="/api/dataset-selector"
     hx-trigger="datasets-changed from:body"
     hx-swap="outerHTML">
  <form class="dataset-form" method="get" action="" style="margin-left:1rem;">
    <label for="dataset">Dataset:</label>
    <select id="dataset" name="dataset" onchange="this.form.submit()">
      {% for s in datasets %}
        <option value="{{ s.name }}" {% if s.name == dataset %}selected{% endif %}>{{ s.name | scenario_label }}</option>
      {% endfor %}
    </select>
  </form>
</div>
