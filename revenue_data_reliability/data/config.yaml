name: demo_run
seed: 42

timeline:
  # The end month is derived at run time: the last completed month before
  # today. n_months is only used when --years-to-backtrack is not provided.
  n_months: 60
  # Actual volume trajectory: 0 is flat, positive grows, negative declines.
  trend_per_month: 0.02
  phases:
    - {name: growth,  months: 24, driver: customer_adds}
    - {name: plateau, months: 18, driver: none}
    - {name: decline, months: 18, driver: churn}
  seasonality:
    spring_peak_multiplier: 1.15
    summer_peak_multiplier: 1.10
    q4_lift_multiplier: 1.05
    january_dip_multiplier: 0.85

scale:
  orders_per_month_base: 30000
  base_customers: 2000
  growth_adds_per_month: 100
  items: 5000
  distribution_centers: 12
  manufacturers: 400
  currencies: 6
  gl_accounts: 3
  item_categories: 5
  item_category_names:
    - Electronics
    - Industrial
    - Office
    - Safety
    - Misc
  customer_segment_names:
    - enterprise
    - midmarket
    - smb
  customer_segment_weights: [0.15, 0.30, 0.55]
  gl_category_bias_spread: 0.004

budget:
  # Plan total as a multiple of the actual billings in the window.
  # <1 makes the dataset beat plan, >1 makes it miss plan.
  target_ratio: 1.0

concentration:
  # A small cohort of key accounts takes a large share of orders, so the
  # Top 5 Clients table shows real concentration instead of noise.
  customer_whales: 5
  customer_whale_share: 0.45
  customer_whale_segment: enterprise
  # Spread the cohort across tiers so the segment occupies several of the
  # top rows rather than one.
  customer_whale_activities: [high, med, low]
  # Item mix leans into one category and one ABC class, so Top 5 Products
  # concentrates in a single group.
  item_focus_category: Industrial
  item_focus_share: 0.50
  item_focus_abc: A
  item_abc_a_share: 0.60

variance:
  # Plan mix factors. <1 means the group was under-budgeted and tends to beat
  # plan; >1 means it was over-budgeted and tends to miss.
  category_plan_shift:
    Electronics: 0.95
    Industrial: 0.90
    Office: 1.05
    Safety: 1.10
    Misc: 1.15
  # Per-month drift of the actual category mix.
  category_trend:
    Electronics: 0.020
    Industrial: 0.012
    Office: -0.010
    Safety: 0.006
    Misc: -0.018
  # Per-month drift of the actual segment mix. The dashboard strikes the plan
  # from the opening months, so this drift is what makes the segment bridge
  # show both positive and negative bars.
  segment_trend:
    enterprise: 0.020
    midmarket: 0.004
    smb: -0.015

dimension_drift:
  sku_retirements: 2
  sku_renames: 2
  segment_remaps: 2
  dc_ownership_changes: 1

defects:
  enabled_from_month: 7
  toggles:
    orphaned_item_id: true
    duplicate_invoice_line: true
    missing_customer_mapping: true
    stale_load: true
    billings_gl_variance: true
    restatement: true
    fx_gap: true
    orphaned_backorder: true
    phantom_return: true
  billings_gl_variance_category_weights: [0.4, 0.2, 0.15, 0.15, 0.1]
  counts_per_type_per_month: 1

reconciliation:
  billings_gl_tolerance_pct: 0.5

output:
  format: parquet
