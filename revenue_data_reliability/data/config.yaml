name: demo_run
seed: 42

timeline:
  # The end month is derived at run time: the last completed month before
  # today. n_months is only used when --years-to-backtrack is not provided.
  n_months: 60
  phases:
    - {name: growth,  months: 24, driver: customer_adds}
    - {name: plateau, months: 18, driver: none}
    - {name: decline, months: 18, driver: churn}
  seasonality:
    spring_peak_multiplier: 1.15
    summer_peak_multiplier: 1.10
    q4_lift_multiplier: 1.05
    january_dip_multiplier: 0.85

scale:
  orders_per_month_base: 30000
  base_customers: 2000
  growth_adds_per_month: 100
  items: 5000
  distribution_centers: 12
  manufacturers: 400
  currencies: 6
  gl_accounts: 3
  item_categories: 5
  item_category_names:
    - Electronics
    - Industrial
    - Office
    - Safety
    - Misc
  customer_segment_names:
    - enterprise
    - midmarket
    - smb
  customer_segment_weights: [0.15, 0.30, 0.55]
  gl_category_bias_spread: 0.004
  budget_growth_target_by_year:
    2021: 1.00
    2022: 1.08
    2023: 1.05
    2024: 1.05
    2025: 1.02
    2026: 1.00

dimension_drift:
  sku_retirements: 2
  sku_renames: 2
  segment_remaps: 2
  dc_ownership_changes: 1

defects:
  enabled_from_month: 7
  toggles:
    orphaned_item_id: true
    duplicate_invoice_line: true
    missing_customer_mapping: true
    stale_load: true
    billings_gl_variance: true
    restatement: true
    fx_gap: true
    orphaned_backorder: true
    phantom_return: true
  billings_gl_variance_category_weights: [0.4, 0.2, 0.15, 0.15, 0.1]
  counts_per_type_per_month: 1

reconciliation:
  billings_gl_tolerance_pct: 0.5

output:
  format: parquet
