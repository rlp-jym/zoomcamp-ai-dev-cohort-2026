services:
  - type: web
    name: revenue-data-platform
    env: docker
    dockerfilePath: infra/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rlp-db
          property: connectionString
      - key: APP_ENV
        value: prod
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEBHOOK_TOKEN
        generateValue: true

databases:
  - name: rlp-db
    plan: free
    databaseName: rlp
    user: rlp