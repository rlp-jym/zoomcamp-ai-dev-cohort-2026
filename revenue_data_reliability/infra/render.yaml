services:
  - type: web
    name: revenue-platform-staging
    env: docker
    branch: staging
    rootDir: revenue_data_reliability
    dockerfilePath: infra/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon; value set in the Render dashboard
      - key: APP_ENV
        value: staging
      - key: OTEL_METRIC_INTERVAL_SECONDS
        value: "300"
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEBHOOK_TOKEN
        generateValue: true

  - type: web
    name: revenue-platform-prod
    env: docker
    branch: main
    rootDir: revenue_data_reliability
    dockerfilePath: infra/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon; value set in the Render dashboard
      - key: APP_ENV
        value: prod
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEBHOOK_TOKEN
        generateValue: true

# Legacy Render Postgres. The live services use Neon via DATABASE_URL above.
# Keep until the unused databases are confirmed empty and backed up, then remove.
databases:
  - name: rlp-db-staging
    plan: free
    databaseName: rlp_staging
    user: rlp
  - name: rlp-db-prod
    plan: free
    databaseName: rlp_prod
    user: rlp
