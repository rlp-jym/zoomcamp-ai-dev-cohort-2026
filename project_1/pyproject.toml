[project]
name = "project-1"
version = "0.1.0"
description = "Revenue Data Reliability Platform"
readme = "README.md"
authors = [
    { name = "rlp-jym", email = "ralpj.jayoma@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "duckdb>=1.0",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48",
    "boto3>=1.35",
    "groq>=0.11",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "jupyterlab>=4.6.4",
    "kagglehub>=1.0.2",
    "psycopg-pool>=3.3.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
