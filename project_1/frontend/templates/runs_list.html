{% extends "base.html" %}
{% block title %}Runs{% endblock %}
{% block content %}
<h1>Runs</h1>
<table class="table">
  <thead>
    <tr><th>ID</th><th>Scenario</th><th>Status</th><th>Started</th><th>Duration</th><th>Published</th></tr>
  </thead>
  <tbody>
    {% for r in runs %}
    <tr>
      <td><a href="/runs/{{ r.id }}">{{ r.id }}</a></td>
      <td>{{ r.scenario }}</td>
      <td>{{ r.status }}</td>
      <td>{{ r.started_at }}</td>
      <td>{{ r.duration }}</td>
      <td>{{ "yes" if r.published else "no" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
