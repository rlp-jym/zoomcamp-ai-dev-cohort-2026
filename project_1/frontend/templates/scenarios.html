{% extends "base.html" %}
{% block title %}Scenarios{% endblock %}
{% block content %}
<h1>Scenarios</h1>
<table class="table">
  <thead>
    <tr><th>Name</th><th>Status</th><th>Tables</th><th>Seed</th><th>Created</th><th>Action</th></tr>
  </thead>
  <tbody>
    {% for s in scenarios %}
    <tr>
      <td>{{ s.name }}</td>
      <td>{{ s.status }}</td>
      <td>{{ s.tables }}</td>
      <td>{{ s.seed }}</td>
      <td>{{ s.created_at }}</td>
      <td>
        <form method="post" action="/scenarios/{{ s.name }}/run">
          <button class="btn" type="submit">Run Pipeline</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
