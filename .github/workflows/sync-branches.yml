name: Sync Branches

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-main-to-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          git fetch origin staging
          count=$(git rev-list --count origin/staging..origin/main)
          echo "count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -eq 0 ]; then
            echo "No new commits on main relative to staging. Skipping."
          fi

      - name: Create PR from main to staging
        if: steps.changes.outputs.count != '0'
        run: |
          if ! gh pr list --base staging --head main --state open --json number --jq '.[].number' | grep -q .; then
            echo "No open PR found. Creating one..."
            gh pr create \
              --base staging \
              --head main \
              --title "chore: sync main into staging" \
              --body "Automated back-merge of main into staging. This does not auto-merge; branch protection rules still apply."
          else
            echo "An open PR from main to staging already exists. Skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-staging-to-main:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          git fetch origin main
          count=$(git rev-list --count origin/main..origin/staging)
          echo "count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -eq 0 ]; then
            echo "No new commits on staging relative to main. Skipping."
          fi

      - name: Create PR from staging to main
        if: steps.changes.outputs.count != '0'
        run: |
          if ! gh pr list --base main --head staging --state open --json number --jq '.[].number' | grep -q .; then
            echo "No open PR found. Creating one..."
            gh pr create \
              --base main \
              --head staging \
              --title "chore: sync staging into main" \
              --body "Automated forward-merge of staging into main. This does not auto-merge; branch protection rules and approval gates still apply."
          else
            echo "An open PR from staging to main already exists. Skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
